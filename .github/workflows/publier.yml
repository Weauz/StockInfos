# Fabrique l'installateur Windows et l'ajoute à chaque release publiée (tag vX.Y.Z)
name: Publier une version

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Numéro de version depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Application
        run: npx electron-builder --win dir --x64 --publish never

      - name: Installateur
        shell: bash
        run: |
          choco install nsis -y --no-progress
          VERSION=$(node -p "require('./package.json').version")
          "/c/Program Files (x86)/NSIS/makensis.exe" -INPUTCHARSET UTF8 -DVERSION=$VERSION installateur/installer.nsi
          ls -la dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StockInfos ${{ github.ref_name }}
          files: dist/StockInfos-Installation.exe

      - name: Fichier (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installateur
          path: dist/StockInfos-Installation.exe
