plugins {
    id 'com.android.application'
}

// La version suit celle de l'application PC (package.json)
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def ver = (pkg.version ?: '1.0.0') as String
def parts = ver.tokenize('.').collect { it as int }
def code = parts[0] * 10000 + parts[1] * 100 + parts[2]

// Clé de signature : dans android/signature/ (jamais sur GitHub). Sans elle, la version « release » n'est pas fabriquée pour le téléphone de ton père.
def sigFile = rootProject.file('signature/signature.properties')
def sig = new Properties()
if (sigFile.exists()) sigFile.withInputStream { sig.load(it) }

android {
    namespace 'fr.stockinfos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.stockinfos.app'
        minSdk 26
        targetSdk 35
        versionCode code
        versionName ver
    }

    signingConfigs {
        if (sigFile.exists()) {
            release {
                storeFile rootProject.file('signature/' + sig.getProperty('storeFile'))
                storePassword sig.getProperty('storePassword')
                keyAlias sig.getProperty('keyAlias')
                keyPassword sig.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // toujours la même clé : c'est ce qui permet au téléphone d'accepter les mises à jour
            signingConfig sigFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copie l'interface de l'appli PC dans l'app Android avant chaque fabrication
tasks.register('copierInterface', Copy) {
    from('../../app/renderer') { exclude 'index.html' }
    from('../../app/renderer/index.html') {
        filter { String line -> line.contains('<script src="vendor/qr/qrcode.js"></script>') ? '<script src="android-api.js"></script>\n' + line : line }
    }
    from('android-api.js')
    into 'src/main/assets/www'
}
preBuild.dependsOn copierInterface

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

// Après une fabrication « release » : copie l'APK prêt à publier dans le dossier .exe, à côté de l'installateur PC
tasks.register('copierApk', Copy) {
    from(layout.buildDirectory.dir('outputs/apk/release')) { include '*.apk'; rename { 'StockInfos.apk' } }
    into '../../.exe'
    doFirst { if (!sigFile.exists()) throw new GradleException('Clé de signature introuvable (android/signature/signature.properties) : APK non copié.') }
    doLast { println "APK prêt : .exe/StockInfos.apk (version ${ver})" }
}
afterEvaluate { tasks.named('assembleRelease').configure { finalizedBy 'copierApk' } }
