<title>StockInfos</title>
<style>
/* VOICE work: a shipped Windows 11 desktop tool for a building-trades pro
   IDEA the chantier stock register, tied to the site calendar
   PICTURE the app window itself: live stock, month planning, alerts, returns
   COLOUR Windows mica neutrals, chantier orange accent, red for shortages
   TYPE Segoe UI Variable with system fallback
   LAYOUT title bar, nav rail left, content right; phone: nav at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#eef0f3,#1b1b1c);--nav:light-dark(#e6e8ec,#202021);--card:light-dark(#fff,#2a2a2b);--card2:light-dark(#f3f4f6,#333335);--ink:light-dark(#1a1a1a,#f2f2f2);--mute:light-dark(#5a5d64,#a9abb0);--line:light-dark(#dcdee3,#3c3c3e);--acc:light-dark(#c2410c,#ff8f4a);--accink:light-dark(#fff,#1a1a1a);--accbg:light-dark(#fff0e6,#3b2617);--red:light-dark(#c42b1c,#ff8d84);--redbg:light-dark(#fde7e9,#3e1f1e);--amb:light-dark(#8a5300,#ffd27a);--ambbg:light-dark(#fff3cd,#3a3116);--ok:light-dark(#0f7b0f,#86d98a);--okbg:light-dark(#e1f4df,#1d3320)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
.win.t-light{color-scheme:light}
.win.t-dark{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.win{height:100%;display:grid;grid-template-rows:36px minmax(0,1fr);background:var(--bg);color:var(--ink)}
.tb{display:flex;align-items:center;gap:10px;padding-left:12px;background:var(--nav);font-size:13px;user-select:none}
.logo{width:20px;height:20px;border-radius:5px;background:var(--acc);color:var(--accink);display:grid;place-items:center}
.logo svg{width:14px;height:14px}
.sp{flex:1}
.cap{width:46px;height:36px;display:grid;place-items:center;color:var(--mute);border:0;background:none}
.cap:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.cap.x:hover{background:#c42b1c;color:#fff}
.cap svg{width:12px;height:12px;stroke-width:1.3}
.body{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:0}
nav{background:var(--nav);padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;background:none;border-radius:6px;cursor:pointer;position:relative;text-align:left}
.nb:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nb.on{background:color-mix(in srgb,var(--ink) 9%,transparent);font-weight:600}
.nb.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--acc)}
.badge{margin-left:auto;background:var(--red);color:var(--card);font-size:13px;font-weight:700;border-radius:10px;padding:0 7px;line-height:19px}
nav .grow{flex:1}
.gs{font-size:13px;color:var(--mute);padding:8px 12px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
main{overflow:auto;padding:22px clamp(14px,3vw,32px) 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:28px;line-height:1.1;margin:0 auto 0 0;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
h4{font-size:14px;margin:18px 0 8px}
.datebar{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
.datebar span{padding:0 6px;color:var(--mute);font-size:13px;white-space:nowrap}
.datebar input{border:0;background:none;height:32px;padding:0 4px}
.ib{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:6px;cursor:pointer;flex:none}
.ib:hover{background:var(--card2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--red)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.note{color:var(--mute);font-size:13px;margin:0 0 14px}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.cols>.card{margin-bottom:16px}
@media(max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.al{display:flex;gap:12px;padding:12px;border-radius:8px;background:var(--redbg);margin-bottom:8px;align-items:flex-start;border:0;width:100%;text-align:left;cursor:pointer}
.al.w{background:var(--ambbg)}
.al>svg{color:var(--red);margin-top:2px}
.al.w>svg{color:var(--amb)}
.al strong{display:block}
.al small{display:block;color:var(--mute);font-size:13px}
.ret{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ret:first-of-type{border-top:0}
.jx{display:grid;place-content:center;height:52px;border-radius:8px;background:var(--accbg);color:var(--acc);font-weight:700;font-size:17px;line-height:1.1;text-align:center}
.jx small{display:block;font-weight:500;font-size:13px}
.ret strong{display:block}
.ret span{display:block;color:var(--mute);font-size:13px}
.empty{color:var(--mute);padding:14px 4px;display:flex;gap:10px;align-items:center}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;flex:1 1 220px;max-width:360px}
.search input{border:0;background:none;outline:0;width:100%;height:32px}
select,.in{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 10px;width:100%}
.tools select{width:auto}
textarea.in{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.in:focus,select:focus{border-color:var(--acc);outline:0;box-shadow:inset 0 -2px 0 var(--acc)}
.plist{display:flex;flex-direction:column;gap:8px}
.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.pn strong{display:block;font-size:15px}
.pn>span{color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:13px;padding:1px 8px;border-radius:10px;background:var(--card2);color:var(--mute);white-space:nowrap}
.av{font-variant-numeric:tabular-nums;white-space:nowrap}
.av b{font-size:20px}
.av span{color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar i.ko{background:var(--red)}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap;justify-self:end}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.lo{background:var(--ambbg);color:var(--amb)}
.pill.ko{background:var(--redbg);color:var(--red)}
.seg{display:inline-flex;background:var(--card2);border-radius:7px;padding:3px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.mhead{display:flex;align-items:center;gap:2px;font-weight:600;font-size:15px}
.mhead b{min-width:130px;text-align:center;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--card2);padding:6px 8px;font-size:13px;color:var(--mute);font-weight:600}
.day{background:var(--card);min-height:104px;padding:4px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.day:hover{background:color-mix(in srgb,var(--acc) 5%,var(--card))}
.day.out{background:color-mix(in srgb,var(--card) 55%,var(--bg));color:var(--mute)}
.day .n{font-size:13px;padding:1px 6px;align-self:flex-start;border-radius:10px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--acc);color:var(--accink);font-weight:700}
.day.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.ev{font-size:13px;padding:1px 6px;border:0;border-radius:4px;background:color-mix(in srgb,var(--c) 20%,var(--card));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;width:100%}
.ev.short{box-shadow:inset 0 0 0 1.5px var(--red)}
.more{font-size:13px;color:var(--mute);padding-left:6px}
@media(max-width:700px){.day{min-height:62px}.ev{font-size:0;height:7px;padding:0;border-left:0;background:var(--c)}.dow{padding:6px 2px;text-align:center}}
.elist{display:flex;flex-direction:column;gap:10px}
.ecard{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;align-items:start}
.ecard:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.edate{border-radius:8px;background:color-mix(in srgb,var(--c) 16%,var(--card));text-align:center;padding:6px 4px;line-height:1.15;font-size:13px}
.edate b{display:block;font-size:22px}
.ecard strong{font-size:15px}
.meta{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.meta span{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.meta svg{width:14px;height:14px}
@media(max-width:600px){.ecard{grid-template-columns:56px minmax(0,1fr)}.ecard .pill{grid-column:2;justify-self:start}}
details summary{cursor:pointer;color:var(--mute);margin:16px 0 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:12px;z-index:20}
.dlg{background:var(--card);color:var(--ink);border-radius:12px;width:min(900px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.dh h3{margin:0 auto 0 0;font-size:18px;font-weight:600}
.db{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.db.p{grid-template-columns:240px minmax(0,1fr)}
.pad{padding:0 20px 18px}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;background:var(--card2);position:sticky;bottom:0}
.df .l{margin-right:auto}
@media(max-width:700px){.db,.db.p{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:13px;font-weight:600}
.h{font-size:13px;color:var(--mute)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.step{display:flex;gap:4px}
.step input{text-align:center;font-variant-numeric:tabular-nums}
.step .btn{width:34px;padding:0;justify-content:center;flex:none}
.photo{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--mute);cursor:pointer;overflow:hidden;background:var(--card2);text-align:center;padding:8px;width:100%;margin-bottom:8px}
.photo.has{padding:0;border-style:solid}
.photo svg{width:28px;height:28px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.drag{border-color:var(--acc);background:var(--accbg)}
.read{background:var(--card2);border-radius:10px;padding:14px 16px;align-self:start}
.read h5{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.quote{background:var(--card);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:13px;margin-bottom:12px;border:1px solid var(--line);overflow-wrap:anywhere}
mark{background:color-mix(in srgb,var(--acc) 26%,transparent);color:inherit;border-radius:3px;padding:0 1px}
mark.u{background:color-mix(in srgb,var(--amb) 30%,transparent)}
mark.d{background:color-mix(in srgb,#2563eb 25%,transparent)}
.ri{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.ri:last-child{border-bottom:0}
.ri .ok{color:var(--ok);font-size:13px;white-space:nowrap}
.ri .ko{color:var(--red);font-size:13px;font-weight:600;text-align:right}
.unk{background:var(--ambbg);border-radius:8px;padding:10px 12px;margin-top:8px}
.unk p{margin:0 0 8px}
.unk .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.unk select{width:auto;height:30px;font-size:13px}
.unk .in{height:30px;font-size:13px}
.info{background:var(--accbg);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.set .card{margin:0}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow select{width:auto;max-width:60%}
.sw{appearance:none;width:40px;height:20px;border-radius:10px;border:1px solid var(--mute);position:relative;cursor:pointer;flex:none;background:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--mute);transition:.15s}
.sw:checked{background:var(--acc);border-color:var(--acc)}
.sw:checked::after{left:23px;background:var(--accink)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:none;opacity:1}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.toast,.sw::after{transition:none}}
@media(max-width:760px){.body{grid-template-columns:60px minmax(0,1fr)}.nb span,.nb .badge,.gs span{display:none}.nb{justify-content:center;padding:0}.gs{justify-content:center;padding:8px 0}}
@media(max-width:520px){.body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}nav{order:2;flex-direction:row;padding:4px}nav .grow,.gs{display:none}.nb{flex:1;height:48px}.nb.on::before{left:35%;right:35%;top:auto;bottom:3px;width:auto;height:3px}.cap{width:38px}input,select,textarea{font-size:16px}h1{font-size:24px}.datebar{width:100%;order:2}.datebar input{flex:1}.row2{grid-template-columns:minmax(0,1fr)}}

      const seen=new Set();

          const f={title:icsText(v.SUMMARY?.v)||'(Sans titre)',start:o.s,end:o.e,lieu:icsText(v.LOCATION?.v),desc:htmlToText(icsText(v.DESCRIPTION?.v))};
          const ex=S.events.find(e=>e.id===id);
          if(ex){ex.cal=c.id;if(ex.title!==f.title||ex.start!==f.start||ex.end!==f.end||ex.lieu!==f.lieu||ex.desc!==f.desc){Object.assign(ex,f);nU++}}

  render();planSync();
}

document.addEventListener('click',e=>{
  if(DRAG.skip){DRAG.skip=false;return}
  if(e.target.classList.contains('pov')){closePal();return}
  if(e.target.classList.contains('ov')){closeM();return}
  if(U.pvm&&!e.target.closest('.vsel')){U.pvm=false;render();if(!e.target.closest('[data-act]')||!document.body.contains(e.target))return}
  if(U.dp&&!e.target.closest('.dw')){U.dp=false;render();if(!e.target.closest('[data-act]')||!document.body.contains(e.target))return}
  const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.cname'))e.target.blur();
  if(e.key==='Enter'&&e.target.id==='w-co'&&MD&&MD.k==='co'){A['co-ok']()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();PAL.on?closePal():openPal();return}
  if(PAL.on){if(e.key==='Escape'){closePal();return}if(e.key==='ArrowDown'){PAL.i=Math.min(PAL.res.length-1,PAL.i+1);drawPal();e.preventDefault();return}if(e.key==='ArrowUp'){PAL.i=Math.max(0,PAL.i-1);drawPal();e.preventDefault();return}if(e.key==='Enter'){const r=PAL.res[PAL.i];closePal();if(r)r.act();e.preventDefault();return}return}
  if(e.key==='Escape'&&U.pvm){U.pvm=false;render()}
  if(e.key==='Escape'&&U.dp){U.dp=false;render()}
  if(U.view==='plan'&&!MD&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.target.matches('input,textarea,select')){const k=e.key.toLowerCase(),m={d:'jour',w:'semaine',m:'mois',a:'planning',x:'4j'};if(m[k]){U.pv=m[k];U.pvm=false;render();e.preventDefault()}else if(k==='t'){U.pd=TODAY;render()}else if(e.key==='ArrowLeft'&&U.pv!=='planning'){pvMove(-1);render()}else if(e.key==='ArrowRight'&&U.pv!=='planning'){pvMove(1);render()}}
  if(e.key==='Escape'&&MD)closeM();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.day')){e.preventDefault();A.day(e.target)}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('div.pc')){e.preventDefault();(A[e.target.dataset.act]||A.openp)(e.target)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='palq'){PAL.q=t.value;PAL.i=0;drawPal();return}
  if(t.classList.contains('rb')&&MD&&MD.k==='ret'){const r=MD.rows[+t.dataset.i];r.back=Math.max(0,Math.min(r.q,parseInt(t.value)||0));const pos=t.selectionStart;drawRet();const n=document.querySelector(`.rb[data-i="${t.dataset.i}"]`);if(n){n.focus()}}

  if(t.dataset.ev&&MD&&MD.k==='e'){MD.d[t.dataset.ev]=t.value;MD.mk=-1;redrawRead()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='d'&&t.value){U.date=t.value;U.ym=t.value.slice(0,7);render()}
  if(t.dataset.in==='cat'){U.cat=t.value;render()}
  if(t.dataset.in==='sort'){U.sort=t.value;S.ui.sort=t.value;save();render()}
  if(t.classList.contains('rf')&&MD&&MD.k==='ret'){MD.rows[+t.dataset.i].fate=t.value}
  if(t.matches('[data-punit]')&&MD&&MD.k==='p'){readP();if(!MD.d.usize)MD.d.usize=1;drawP();$('.adv')?.setAttribute('open','')}
  if(t.dataset.calf){const c=calById(t.dataset.id);if(c){const f=t.dataset.calf;c[f]=f==='count'?t.checked:f==='name'?(t.value.trim()||c.name):t.value;save();render();if(f==='count')toast(t.checked?'Ses événements sortent du matériel':'Ses événements ne sortent plus de matériel')}}
  if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.type==='checkbox'?t.checked:t.value;save();render();planSync();toast('Réglage enregistré')}
  if(t.dataset.additem!==undefined&&t.value&&MD){const m=MD.d.man.items;m[t.value]=(m[t.value]||0)+1;t.value='';redrawMan()}
  if(t.dataset.assoc!==undefined&&t.value){const u=parse(MD.d.desc).unknown[+t.dataset.assoc],p=byId(t.value);if(u&&p){p.kw=p.kw||[];p.kw.push(u.name);save();redrawRead();render();toast('« '+u.name+' » sera compté comme '+p.name)}}
});

else{if(!S.cfg.coAsked){MD={k:'co'};$('#modal').innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt" style="width:min(420px,100%)"><div class="dh"><h3 id="mt">Nom de ton entreprise</h3></div><div class="wel"><p style="margin:0">L'app s'appelle maintenant <b>StockInfos</b>. Quel nom d'entreprise veux-tu afficher en haut ?</p><input class="in" id="w-co" value="${esc(S.cfg.company||'')}" placeholder="Ex : Location Martin" autocomplete="off"><span class="h">Tu pourras le changer dans Paramètres.</span></div><div class="df"><button class="btn" data-act="co-skip">Ne rien afficher</button><button class="btn pri" data-act="co-ok">Valider</button></div></div></div>`;setTimeout(()=>$('#w-co')?.focus(),50)}
  if(S.cfg.cals.length)syncNow(false);}
}
