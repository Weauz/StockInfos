.pill.lo{background:var(--ambbg);color:var(--amb)}

.seg{display:inline-flex;background:var(--card2);border-radius:7px;padding:3px}

.mhead{display:flex;align-items:center;gap:2px;font-weight:600;font-size:15px}

async function unzipFiles(buf,want){

  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out={},td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(v.getUint32(p,true)!==0x02014b50)break;
    const meth=v.getUint16(p+10,true),csz=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);

    if(!want(name))continue;

    if(meth===0)out[name]=td.decode(raw);

  }

}

async function readPDF(buf){
  const pdfjs=await import('./vendor/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc=new URL('./vendor/pdfjs/pdf.worker.min.mjs',location.href).href;

      r.it.forEach(i=>{const c=cells[cells.length-1];if(c&&i.x-(c.x1)<Math.max(1.5,i.h*.25)&&i.x-c.x1>-1){c.s+=(i.x-c.x1>i.h*.15?' ':'')+i.s;c.x1=Math.max(c.x1,i.x+i.w)}else cells.push({s:i.s,x0:i.x,x1:i.x+i.w})});

function readCSV(buf){

  const sep=[';','\t',','].map(c=>[c,head.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur.trim());cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur.trim());rows.push(row);row=[];cur=''}
    else cur+=ch}
  if(cur||row.length){row.push(cur.trim());rows.push(row)}
  return[{name:'Fichier',rows}];
}

function readHTML(){
  const d=MD.d,p=P(d),r=rng(d);
  const marks=[...p.hits.map(h=>({a:h.s,b:h.e,c:h.pk?'k':''})),...p.unknown.map(u=>({a:u.a,b:u.b,c:'u'})),...(p.amb||[]).map(u=>({a:u.s,b:u.e,c:'u'})),...(p.umiss||[]).map(u=>({a:u.s,b:u.e,c:'u'})),...(p.dates?[{a:p.dates.a,b:p.dates.b,c:'d'}]:[])].sort((x,y)=>x.a-y.a);
  let q='',i=0;for(const m of marks){if(m.a<i)continue;q+=esc(d.desc.slice(i,m.a))+`<mark class="${m.c}">${esc(d.desc.slice(m.a,m.b))}</mark>`;i=m.b}q+=esc(d.desc.slice(i));
  const days=[];for(let x=r.s;x<=r.re;x=add(x,1))days.push(x);

function unfoldICS(t){return t.replace(/\r?\n[ \t]/g,'').split(/\r?\n/)}

async function syncNow(manual){

          const base=v.UID.v+'|'+(o.occ?'@'+o.occ:''),id=(c.legacy&&!o.occ)?hashId(v.UID.v+'|'):hashId(c.id+'|'+base);seen.add(id);
          const f={title:icsText(v.SUMMARY?.v)||'(Sans titre)',start:o.s,end:o.e,t0:icsTime(v.DTSTART,false),t1:v.DTEND?icsTime(v.DTEND,true):'',lieu:icsText(v.LOCATION?.v),desc:htmlToText(icsText(v.DESCRIPTION?.v))};
          const ex=S.events.find(e=>e.id===id);
          if(ex){ex.cal=c.id;if(ex.title!==f.title||ex.start!==f.start||ex.end!==f.end||(ex.t0||'')!==f.t0||(ex.t1||'')!==f.t1||ex.lieu!==f.lieu||ex.desc!==f.desc){Object.assign(ex,f);nU++}}
          else{S.events.push({id,src:'google',cal:c.id,ci:0,created:Date.now(),man:{packs:{},items:{}},...f});nA++}
        }
      }

      c.last=Date.now();c.err=null;
    }catch(e){c.err=String(e.message||e).replace(/^Error invoking remote method '[^']+': (Error: )?/,'');errs.push(c.name+' : '+c.err)}
  }

  if(errs.length&&manual)toast('Synchro impossible pour '+errs.join(' · '));
  else if(manual||nA||nU||nD)toast(nA||nU||nD?`Agendas : ${nA} ajouté${nA>1?'s':''}, ${nU} mis à jour, ${nD} supprimé${nD>1?'s':''}`:'Agendas : rien de nouveau');
  render();planSync();
}

  if(PAL.on){if(e.key==='Escape'){closePal();return}if(e.key==='ArrowDown'){PAL.i=Math.min(PAL.res.length-1,PAL.i+1);drawPal();e.preventDefault();return}if(e.key==='ArrowUp'){PAL.i=Math.max(0,PAL.i-1);drawPal();e.preventDefault();return}if(e.key==='Enter'){const r=PAL.res[PAL.i];closePal();if(r)r.act();e.preventDefault();return}return}
  if(e.key==='Escape'&&U.pvm){U.pvm=false;render()}
  if(e.key==='Escape'&&U.dp){U.dp=false;render()}
  if(U.view==='plan'&&!MD&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.target.matches('input,textarea,select')){const k=e.key.toLowerCase(),m={d:'jour',w:'semaine',m:'mois',a:'planning',x:'4j'};if(m[k]){U.pv=m[k];U.pvm=false;render();e.preventDefault()}else if(k==='t'){U.pd=TODAY;render()}else if(e.key==='ArrowLeft'&&U.pv!=='planning'){pvMove(-1);render()}else if(e.key==='ArrowRight'&&U.pv!=='planning'){pvMove(1);render()}}
  if(e.key==='Escape'&&MD)closeM();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.day')){e.preventDefault();A.day(e.target)}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('div.pc')){e.preventDefault();(A[e.target.dataset.act]||A.openp)(e.target)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.qc){U.qc[t.dataset.qc]=t.value;if(t.dataset.qc==='a'&&U.qc.b<U.qc.a){U.qc.b=U.qc.a;const bb=document.querySelector('[data-qc=b]');if(bb)bb.value=U.qc.a}clearTimeout(window.__qct);window.__qct=setTimeout(()=>{const r=$('#qcr');if(r)r.innerHTML=qcRes()},180);return}
  if(MD&&MD.k==='imp'&&MD.inv&&MD.inv.rows&&/^inv(cnt|hs|rem)$/.test(t.dataset.in||'')){const r=MD.inv.rows[+t.dataset.k],f={invcnt:'ucnt',invhs:'uhs',invrem:'urem'}[t.dataset.in];r[f]=t.value;const e=document.querySelector(`.invtot[data-k="${t.dataset.k}"]`);if(e)e.innerHTML=invTotTxt(r);return}

  if(MD&&MD.k==='ret'&&(t.classList.contains('rok')||t.classList.contains('rcs'))){const i=+t.dataset.i,r=MD.rows[i],v=Math.max(0,parseInt(t.value)||0);
    if(t.classList.contains('rok')){r.ok=Math.min(r.q,v);if(r.ok+r.cs>r.q)r.cs=r.q-r.ok}else{r.cs=Math.min(r.q,v);if(r.ok+r.cs>r.q)r.ok=r.q-r.cs}
    const o=document.querySelector(`.rok[data-i="${i}"]`),c=document.querySelector(`.rcs[data-i="${i}"]`);if(o&&o!==t)o.value=r.ok;if(c&&c!==t)c.value=r.cs;if(c)c.classList.toggle('on',r.cs>0);retRowState(i)}
  if(MD&&MD.k==='ret'&&t.classList.contains('rnote'))MD.rows[+t.dataset.i].note=t.value;
  if(MD&&MD.k==='ret'&&t.id==='rcom')MD.comment=t.value;
  if(t.dataset.in==='q'){U.q=t.value;$('#plist').innerHTML=plistHTML()}
  if(t.dataset.ev&&MD&&MD.k==='e'){MD.d[t.dataset.ev]=t.value;MD.mk=-1;redrawRead()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='d'&&t.value){U.date=t.value;U.ym=t.value.slice(0,7);render()}
  if(t.dataset.in==='cat'){U.cat=t.value;render()}
  if(t.dataset.in==='sort'){U.sort=t.value;S.ui.sort=t.value;save();render()}
  if(t.classList.contains('rf')&&MD&&MD.k==='ret'){MD.rows[+t.dataset.i].fate=t.value}
  if(MD&&MD.k==='imp'&&MD.imp&&t.dataset.in){const I=MD.imp,v=t.value;
    if(t.dataset.in==='impmap'){const c=+t.dataset.c;if(v)I.map=I.map.map(x=>x===v?'':x);I.map[c]=v}
    else if(t.dataset.in==='imphr'){I.hr=+v;I.map=impGuess(I.sheets[I.si].rows,I.hr).map}
    else if(t.dataset.in==='impsheet'){I.si=+v;const g=impGuess(I.sheets[I.si].rows);I.hr=g.hr;I.map=g.map}
    else if(t.dataset.in==='impmode')I.mode=v;
    else if(t.dataset.in==='impex'){I.ex=I.ex||{};if(t.checked)delete I.ex[t.dataset.k];else I.ex[t.dataset.k]=1;I.open=true}
    drawImp();return}
  if(t.matches('[data-punit]')&&MD&&MD.k==='p'){readP();if(!MD.d.usize)MD.d.usize=1;drawP();$('.adv')?.setAttribute('open','')}
  if(t.dataset.calf){const c=calById(t.dataset.id);if(c){const f=t.dataset.calf;c[f]=f==='count'?t.checked:f==='name'?(t.value.trim()||c.name):t.value;save();render();if(f==='count')toast(t.checked?'Ses événements sortent du matériel':'Ses événements ne sortent plus de matériel')}}
  if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.type==='checkbox'?t.checked:t.value;save();render();planSync();toast('Réglage enregistré')}
  if(t.dataset.additem!==undefined&&t.value&&MD){const m=MD.d.man.items;m[t.value]=(m[t.value]||0)+1;t.value='';redrawMan()}
  if(t.dataset.assoc!==undefined&&t.value){const u=parse(MD.d.desc).unknown[+t.dataset.assoc],p=byId(t.value);if(u&&p){p.kw=p.kw||[];p.kw.push(u.name);save();redrawRead();render();toast('« '+u.name+' » sera compté comme '+p.name)}}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('hashchange',()=>{const v=HV[location.hash.slice(1)];if(v&&v!==U.view){U.view=v;render()}});
for(const p of S.products){if(!p.unit)continue;const k=unitKey(p.unit);if(UV[k]){p.unit=UL[k];continue}const m=/^(\d+(?:[.,]\d+)?)\s*(.+)$/.exec(String(p.unit).trim());if(m&&UV[unitKey(m[2])]){p.usize=parseFloat(m[1].replace(',','.'))||1;p.unit=UL[unitKey(m[2])]}else p.unit=''}
migrateCals();
U.view=HV[location.hash.slice(1)]||'dash';
if(!S.packs)S.packs=[];
U.sort=S.ui.sort||'az';

if(FIRST){MD={k:'w'};$('#modal').innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt" style="width:min(460px,100%)"><div class="dh"><h3 id="mt">Bienvenue dans StockInfos</h3></div><div class="wel"><div class="f" style="margin:0"><label for="w-co">Nom de ton entreprise</label><input class="in" id="w-co" placeholder="Ex : Location Martin" autocomplete="off"><span class="h">Il s'affichera en haut de l'app. Tu pourras le changer dans Paramètres.</span></div><p style="margin:8px 0 0">Comment veux-tu commencer ?</p><button class="btn" data-act="welcome" data-v="ex"><span><b>Avec des exemples</b><small>Du matériel, des kits et des chantiers fictifs pour tout essayer. Tu pourras les effacer dans Paramètres.</small></span></button><button class="btn" data-act="welcome" data-v="vide"><span><b>Avec un stock vide</b><small>Pour saisir directement ton vrai matériel et relier Google Agenda.</small></span></button></div></div></div>`}
else{if(!S.cfg.coAsked){MD={k:'co'};$('#modal').innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt" style="width:min(420px,100%)"><div class="dh"><h3 id="mt">Nom de ton entreprise</h3></div><div class="wel"><p style="margin:0">L'app s'appelle maintenant <b>StockInfos</b>. Quel nom d'entreprise veux-tu afficher en haut ?</p><input class="in" id="w-co" value="${esc(S.cfg.company||'')}" placeholder="Ex : Location Martin" autocomplete="off"><span class="h">Tu pourras le changer dans Paramètres.</span></div><div class="df"><button class="btn" data-act="co-skip">Ne rien afficher</button><button class="btn pri" data-act="co-ok">Valider</button></div></div></div>`;setTimeout(()=>$('#w-co')?.focus(),50)}
  if(S.cfg.cals.length)syncNow(false);}
}
